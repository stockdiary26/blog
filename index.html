<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parkmikyoung</title><style>
:root{--p:#f7f5f0;--i:#1d1d1b;--m:#77736c;--l:#dcd8cf;--y:#e6be46}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px/1.65 Inter,Pretard,Arial,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.w{max-width:1120px;margin:auto;padding:0 30px}.top{height:84px;border-bottom:1px solid var(--l);display:flex;align-items:center}.brand{font-weight:600;font-size:20px}.brand .brand-yellow{color:var(--y)}.brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--y);margin-left:3px}.nav{display:flex;gap:26px;margin-left:auto}.nav button,.link{border:0;background:transparent;color:var(--m);padding:7px 0;font-size:13px}.nav .on{color:var(--i);border-bottom:2px solid var(--y)}main{padding:82px 0}.intro{display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:end;margin-bottom:68px}.ey{font-size:11px;letter-spacing:.13em;color:var(--m);text-transform:uppercase}.intro h1{font-size:clamp(45px,7vw,80px);line-height:.98;letter-spacing:-.08em;font-weight:500;margin:17px 0}.yellow{width:42px;border-top:3px solid var(--y)}.intro p{max-width:300px;color:var(--m)}.toolbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--i);padding-bottom:13px;margin-bottom:22px}.toolbar h2{font-size:13px;margin:0}.filter button{border:0;background:transparent;color:var(--m);font-size:12px}.filter .on{color:var(--i);text-decoration:underline;text-decoration-color:var(--y);text-underline-offset:4px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid var(--l);min-height:210px;overflow:hidden;cursor:pointer}.card:hover{border-color:rgba(0,0,0,.3)}.card img{width:100%;height:190px;object-fit:cover;display:block}.card-body{padding:20px}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:11px}.tag{text-transform:uppercase;letter-spacing:.1em}.card h3{font-size:19px;line-height:1.25;font-weight:500;letter-spacing:-.04em;margin:28px 0 9px}.card p{font-size:13px;color:var(--m);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{grid-column:1/-1;text-align:center;padding:55px;color:var(--m)}.category-card{min-height:270px;position:relative;background:#ebe8e0;display:flex;align-items:end}.category-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.76}.category-card h3{z-index:1;color:var(--i);background:var(--p);padding:7px 11px;margin:16px;font-size:16px}.write{position:fixed;right:max(28px,calc((100vw - 1120px)/2));bottom:28px;width:55px;height:55px;border:0;border-radius:50%;background:var(--i);color:var(--p);font-size:28px}dialog{border:0;background:var(--p);padding:0;width:min(680px,calc(100% - 34px));box-shadow:0 20px 60px #0004}.inner{padding:28px}.head{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding-bottom:15px;margin-bottom:22px}.head h2{font-size:16px;margin:0}.close{border:0;background:transparent;font-size:23px}.field{margin:0 0 17px}.field label{font-size:12px;color:var(--m);display:block;margin-bottom:6px}input,textarea,select{width:100%;padding:10px;border:1px solid var(--l);background:#fffdf8;outline-color:var(--y)}textarea{height:145px;resize:vertical}.file{border:1px dashed var(--l);padding:12px;font-size:12px;color:var(--m)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:25px}.btn{background:transparent;border:1px solid var(--i);padding:8px 14px;font-size:12px}.primary{background:var(--i);color:var(--p)}.danger{color:#9b4c43;border-color:#9b4c43}.detail h1{font-size:32px;letter-spacing:-.05em;font-weight:500}.detail p{white-space:pre-wrap}.detail img,.detail video{width:100%;max-height:360px;object-fit:cover;margin:22px 0}.manage-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--l)}.manage-row img{width:44px;height:34px;object-fit:cover;background:#e7e2d7}.manage-row span{flex:1}@media </style><style>.brand img{display:block;width:auto;height:25px}</style><style id="category-button-styles">

</style><style>.detail-article .detail-edit{display:block;margin:32px 0 0 auto;border-radius:999px;padding:8px 20px;border-color:rgba(0,0,0,.2)}#editPost{border-radius:999px;padding:8px 20px;border-color:rgba(0,0,0,.2)}</style><style id="mobile-header-layout">

</style><style>@media(max-width:700px){.category-title-suffix{display:none}}</style><script defer src="/app-core.js"></script><script defer src="/post-links.js"></script><script defer src="/inline-blocks.js"></script><script defer src="/detail-page.js"></script><script defer src="/footer.js"></script><script defer src="/taxonomy.js"></script><script defer src="/auth-controls.js"></script><script defer src="/app-start.js"></script></head><body><div class="w"><header class="top"><div class="brand"><img src="/pmk_logo.png" alt="parkmikyoung"></div><nav id="nav" class="nav"><button class="on" data-view="diary">Diary</button><button data-view="archive">Archive</button></nav><button id="adminButton" class="link">관리자</button></header><main id="app"></main></div><button id="write" class="write" hidden>+</button>

<dialog id="auth"><form id="authForm" class="inner"><div class="head"><h2 id="authTitle"></h2><button type="button" class="close" data-close="auth">×</button></div><p id="authHelp" style="font-size:13px;color:var(--m)"></p><div class="field"><label>아이디</label><input id="authUser" required></div><div class="field"><label>비밀번호</label><input id="authPassword" type="password" minlength="10" required></div><p id="authError" style="font-size:12px;color:#9b4c43"></p><div class="actions"><button id="authSubmit" class="btn primary"></button></div></form></dialog>
